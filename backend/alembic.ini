# Configuración de Alembic (migraciones versionadas de la base de datos).
# La URL de la base no va aquí: se toma de DATABASE_URL (backend/.env o variable de entorno).
# Uso, desde backend/:
#   alembic upgrade head      aplica las migraciones pendientes
#   alembic current           muestra en qué revisión está la base
#   alembic history           lista las revisiones

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
